spring:
  application:
    name: SpringBatch_HelloWorld

  datasource:
    url: jdbc:mysql://localhost:3306/batch?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      # Automatically create Spring Batch metadata tables in MySQL
      initialize-schema: always
      # Allows the job to execute immediately when the application starts up
    job:
      enabled: true

  jpa:
    show-sql: true
